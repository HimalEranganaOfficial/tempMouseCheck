<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Himal's Remote Mouse Control</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    body { font-family: sans-serif; background: #fff; padding: 20px; text-align: center; }
    .button-grid {
      display: inline-grid;
      grid-template-columns: auto auto auto;
      gap: 10px;
    }
    button {
      padding: 12px 20px;
      font-size: 18px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    #log {
      background: #111;
      color: #0f0;
      padding: 10px;
      height: 200px;
      overflow-y: auto;
      white-space: pre-wrap;
      margin-top: 20px;
      border-radius: 5px;
    }
  </style>
</head>
<body>

<h2>🔁 Himal's Remote Mouse Controller</h2>

<div class="button-grid">
  <div></div><button id="upBtn">⬆️</button><div></div>
  <button id="leftBtn">⬅️</button><div></div><button id="rightBtn">➡️</button>
  <div></div><button id="downBtn">⬇️</button><div></div>
</div>

<h3>📜 Log:</h3>
<div id="log"></div>

<script>
  const log = msg => {
    const el = document.getElementById("log");
    el.textContent += msg + "\n";
    el.scrollTop = el.scrollHeight;
  };

  const options = {
    clean: true,
    connectTimeout: 4000,
    clientId: 'WebClient_' + Math.random().toString(16).substr(2, 8),
    username: 'WebClient',
    password: 'mnG=g85#g%94',
  };

  const connectUrl = 'wss://37dddb13e72947918e4d9af67c714674.s1.eu.hivemq.cloud:8884/mqtt';
  const topic = 'himalsmouse/control';

  const client = mqtt.connect(connectUrl, options);

  client.on('connect', () => {
    log('✅ Connected to MQTT broker');
    client.subscribe(topic, err => {
      if (!err) log('📥 Subscribed to topic: ' + topic);
    });
  });

  client.on('error', err => log('❌ ' + err.message));
  client.on('reconnect', () => log('🔄 Reconnecting...'));
  client.on('message', (t, msg) => log(`📬 ${t}: ${msg}`));

  const buttons = {
    upBtn: 'UP',
    downBtn: 'DOWN',
    leftBtn: 'LEFT',
    rightBtn: 'RIGHT',
  };

  for (const [id, dir] of Object.entries(buttons)) {
    const btn = document.getElementById(id);
    let interval = null;
    btn.addEventListener("pointerdown", () => {
      interval = setInterval(() => {
        client.publish(topic, dir);
        log(`🚀 Sent: ${dir}`);
      }, 60);
    });
    btn.addEventListener("pointerup", () => clearInterval(interval));
    btn.addEventListener("pointerleave", () => clearInterval(interval));
  }
</script>

</body>
</html>
